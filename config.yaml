data:
  provider: "auto"   # auto / baidu / akshare / efinance / ths / yfinance
  akshare_adjust: "qfq"  # qfq=前复权, hfq=后复权, 空字符串=不复权
  timeout: 12
  require_realtime: true  # true=必须拿到实时行情并替换最新日线，否则报错

market:
  default_start_date:
  benchmark: "000300.SS"
  yahoo_suffix:
    sh: ".SS"
    sz: ".SZ"
  min_history_days: 60
  min_avg_amount_20d: 50000000
  exclude_prefixes: ["ST", "*ST", "退"]

scoring:
  short:
    trend: 20
    volume_price: 20
    momentum: 15
    liquidity: 15
    sector_proxy: 15
    risk_control: 15
  long:
    quality_placeholder: 20
    growth_placeholder: 15
    valuation_placeholder: 10
    long_trend: 25
    stability: 20
    risk_control: 10

ui:
  default_top_n: 10
  default_limit: 30

ai_market:
  default_provider: "gemini"
  gemini_base_url: "https://generativelanguage.googleapis.com/v1beta"
  gemini_model: "gemini-2.5-flash"
  deepseek_base_url: "https://api.deepseek.com"
  deepseek_model: "deepseek-v4-flash"
  deepseek_flash_model: "deepseek-v4-flash"
  deepseek_pro_model: "deepseek-v4-pro"
  timeout: 45
  temperature: 0.25
  max_tokens: 4096
  skill_dir: "src/skill/Awesome-finance-skills/skills"

a_stock_data:
  enabled: true
  timeout: 12
  ttl_seconds: 1800
  max_signal_cards:
    stock: 10
    market: 8
  optional_iwencai: true
